[package]
name = "maus"
version = "0.1.0"
edition = "2021"
description = "DPI und Abfragerate (Hz) von Logitech-Maeusen (HID++) setzen - Tray und Kommandozeile"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "=2.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(not(windows))'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
